name: Run Phishing Email Detector

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-phishing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run phishing detector
        run: python detector.py
